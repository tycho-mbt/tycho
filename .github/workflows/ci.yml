name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools \
                                  libx11-dev glslang-tools xvfb vulkan-validationlayers
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Prepare toolchain
        run: ./setup-linux.sh
      - name: Update MoonBit registry
        run: moon update
      - name: Build
        run: ./build.sh
      - name: Unit tests
        run: |
          export PATH="$PWD/.toolchain:$HOME/.moon/bin:$PATH"
          moon test --target native
      - name: Generated code is in sync
        run: ./check-generated.sh
      - name: Examples stay pure MoonBit
        run: ./check-examples-pure.sh
      - name: Run examples on lavapipe
        run: TYCHO_SKIP="07-slang" xvfb-run -a ./tools/run-all.sh lavapipe
      - name: Report Vulkan API coverage
        run: python3 ./tools/coverage.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Mesa lavapipe, Vulkan loader, validation layers, and glslang
        shell: pwsh
        run: |
          # MSYS2 only supports full upgrades: installing into a tree that was merely
          # synced ("pacman -Sy") leaves runtime DLLs behind their package versions, and
          # the ICD and the validation layer then never register with the loader - the
          # examples reported VK_ERROR_LAYER_NOT_PRESENT (-6) and
          # VK_ERROR_INCOMPATIBLE_DRIVER (-9). The first pass can replace the runtime
          # itself, so upgrade twice.
          C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -Syu"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 pacman upgrade failed" }
          C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -Syu"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 pacman upgrade failed" }
          C:\msys64\usr\bin\bash.exe -lc "pacman --noconfirm -S --needed mingw-w64-ucrt-x86_64-mesa mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-vulkan-validation-layers mingw-w64-ucrt-x86_64-glslang"
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 pacman install failed" }
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $vkLoader = "C:\msys64\ucrt64\bin\vulkan-1.dll"
          if (-not (Test-Path $vkLoader)) { throw "Missing $vkLoader" }
          "TYCHO_VULKAN_LIB=$vkLoader" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $lvpDll = "C:\msys64\ucrt64\bin\vulkan_lvp.dll"
          if (-not (Test-Path $lvpDll)) { throw "Missing $lvpDll" }
          $apiVer = "1.4.0"
          $srcIcd = "C:\msys64\ucrt64\share\vulkan\icd.d\lvp_icd.x86_64.json"
          if (Test-Path $srcIcd) {
            $parsed = Get-Content $srcIcd -Raw | ConvertFrom-Json
            if ($parsed.ICD.api_version) { $apiVer = $parsed.ICD.api_version }
          }
          $icdOut = Join-Path $env:RUNNER_TEMP "lvp_icd.json"
          @{
            file_format_version = "1.0.0"
            ICD = @{
              library_path = $lvpDll
              api_version = $apiVer
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path $icdOut -Encoding ascii
          "VK_DRIVER_FILES=$icdOut" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_ICD_FILENAMES=$icdOut" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $valJson = Get-ChildItem -Path "C:\msys64\ucrt64" -Filter "VkLayer_khronos_validation.json" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $valJson) { throw "Missing VkLayer_khronos_validation.json" }
          "VK_LAYER_PATH=$($valJson.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Loader: $vkLoader"
          Write-Host "ICD: $icdOut (api_version=$apiVer)"
          Write-Host "VK_LAYER_PATH: $($valJson.DirectoryName)"
      - name: Setup MSVC x64
        shell: pwsh
        run: |
          $oldSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($p in ($env:Path -split ";")) {
            if ($p) { [void]$oldSet.Add($p.TrimEnd("\")) }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "MSVC installation not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          $tmp = [System.IO.Path]::GetTempFileName()
          cmd.exe /c "call `"$vcvars`" >nul && set > `"$tmp`""
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          Get-Content $tmp | ForEach-Object {
            if ($_ -match "^(INCLUDE|LIB|LIBPATH)=(.*)$") {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } elseif ($_ -match "^Path=(.*)$") {
              foreach ($dir in ($Matches[1] -split ";")) {
                $norm = $dir.TrimEnd("\")
                if ($norm -and -not $oldSet.Contains($norm) -and ($norm -notmatch "WindowsApps")) {
                  $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                }
              }
            }
          }
          Remove-Item $tmp
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          python --version
          moon version
          glslangValidator --version
          python tools/check-vulkan.py
      - name: Update MoonBit registry
        shell: pwsh
        run: moon update
      - name: Build
        shell: pwsh
        run: moon build --target native
      - name: Unit tests
        shell: pwsh
        run: moon test --target native
      - name: Run examples on lavapipe
        shell: pwsh
        env:
          # A hosted runner has no GPU: pin the DX12 examples to WARP instead of
          # letting their hardware-first adapter choice depend on the image.
          TYCHO_DX12_WARP: "1"
        run: python tools/run-ci-suite.py --mode all --skip 07-slang,51-wayland-window --require-pass 35

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoltenVK, Vulkan loader, and glslang
        run: |
          brew install molten-vk vulkan-loader glslang
          PREFIX="$(brew --prefix)"
          ICD=""
          for cand in \
            "$PREFIX/etc/vulkan/icd.d/MoltenVK_icd.json" \
            "$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" \
            "$PREFIX/share/vulkan/icd.d/MoltenVK_icd.json"; do
            if [ -f "$cand" ]; then
              ICD="$cand"
              break
            fi
          done
          if [ -z "$ICD" ]; then
            echo "ERROR: MoltenVK_icd.json not found under $PREFIX" >&2
            find "$PREFIX" -name "*MoltenVK*" 2>/dev/null || true
            exit 1
          fi
          echo "Using MoltenVK ICD: $ICD"
          cat "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          if [ -f "$PREFIX/lib/libvulkan.1.dylib" ]; then
            echo "TYCHO_VULKAN_LIB=$PREFIX/lib/libvulkan.1.dylib" >> "$GITHUB_ENV"
          fi
          echo "DYLD_LIBRARY_PATH=$PREFIX/lib" >> "$GITHUB_ENV"
          echo "MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0" >> "$GITHUB_ENV"
          echo "MVK_CONFIG_LOG_LEVEL=1" >> "$GITHUB_ENV"
      - name: Update MoonBit registry
        run: moon update
      - name: Build
        run: moon build --target native
      - name: Unit tests
        run: moon test --target native
      - name: Run RHI examples on MoltenVK
        run: python3 tools/run-ci-suite.py --mode rhi --skip 51-wayland-window --require-pass 15
